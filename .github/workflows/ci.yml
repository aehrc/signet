name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Static analysis and tests
    runs-on: ubuntu-latest
    services:
      # The data layer's integration tests skip themselves when
      # SIGNET_TEST_DATABASE_URL is unset, so without this service they would
      # pass by not running.
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: signet
          POSTGRES_PASSWORD: signet
          POSTGRES_DB: signet
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U signet"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SIGNET_TEST_DATABASE_URL: postgres://signet:signet@localhost:5432/signet
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - name: Check formatting
        run: bun run format:check

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Check duplication
        run: bun run lint:duplication

      - name: Test with coverage
        run: bun run test:coverage

      - name: Build
        run: bun run build

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      # Also enforces the self-contained-bundle guard in the Dockerfile: a new
      # native dependency fails here rather than at deploy time.
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: false
          load: true
          tags: signet:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # A real database with the two identities a deployment runs, because the
      # server verifies at startup that its role is bound by the tenant isolation
      # policies and refuses to serve when it is not. Started against nothing, the
      # image would exit 1 - correctly - and prove only that it can refuse.
      - name: Start PostgreSQL with the two identities
        run: |
          docker network create signet-ci
          docker run -d --name postgres --network signet-ci \
            -e POSTGRES_USER=signet \
            -e POSTGRES_PASSWORD=signet \
            -e POSTGRES_DB=signet \
            postgres:18-alpine
          for i in $(seq 1 30); do
            if docker exec postgres pg_isready -U signet -d signet; then break; fi
            sleep 1
          done
          docker exec postgres psql -U signet -d signet \
            -c "create role signet_app login password 'signet_app'"

      # Applied by the owning identity, which then grants the serving role its
      # access. The same command the chart's pre-install hook Job runs.
      - name: Migrate as the owning identity
        run: |
          docker run --rm --network signet-ci \
            -e SIGNET_DATABASE_OWNER_URL=postgres://signet:signet@postgres:5432/signet \
            -e SIGNET_DATABASE_URL=postgres://signet_app:signet_app@postgres:5432/signet \
            -e SIGNET_MASTER_KEY=0123456789abcdef0123456789abcdef \
            signet:ci node dist/index.js migrate

      - name: Smoke test the image as the serving role
        run: |
          docker run -d --name signet --network signet-ci -p 3000:3000 \
            -e SIGNET_PUBLIC_URL=http://localhost:3000 \
            -e SIGNET_DATABASE_URL=postgres://signet_app:signet_app@postgres:5432/signet \
            -e SIGNET_MASTER_KEY=0123456789abcdef0123456789abcdef \
            signet:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:3000/healthz; then echo "ok"; break; fi
            if [ "$i" = "30" ]; then
              echo "Server did not become healthy"
              docker logs signet
              exit 1
            fi
            sleep 1
          done
          # The startup check reports the role it verified, so the smoke test can
          # assert the image came up bound by the policies rather than merely up.
          docker logs signet 2>&1 | grep -q signet_app || {
            echo "Startup did not report verifying the serving role"
            docker logs signet
            exit 1
          }

      # The other half of the claim: given the owning identity, the same image must
      # refuse. Without this the check above passes against a startup check that
      # approves anything.
      - name: Assert the image refuses the owning identity
        run: |
          if docker run --rm --network signet-ci \
            -e SIGNET_PUBLIC_URL=http://localhost:3000 \
            -e SIGNET_DATABASE_URL=postgres://signet:signet@postgres:5432/signet \
            -e SIGNET_MASTER_KEY=0123456789abcdef0123456789abcdef \
            signet:ci > owner-start.log 2>&1; then
            echo "The image started with the owning identity, which it must refuse"
            cat owner-start.log
            exit 1
          fi
          grep -q signet owner-start.log || {
            echo "The refusal did not name the role"
            cat owner-start.log
            exit 1
          }
          cat owner-start.log

  helm:
    name: Helm chart
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: azure/setup-helm@v4

      - name: Lint chart
        run: helm lint deploy/helm/signet

      - name: Render chart in each database configuration
        run: |
          helm template signet deploy/helm/signet > /dev/null
          helm template signet deploy/helm/signet \
            --set signet.postgres.persistence.enabled=false \
            --set signet.secretConfig.SIGNET_SMTP_PASSWORD=hunter2 > /dev/null
          helm template signet deploy/helm/signet \
            --set signet.postgres.enabled=false \
            --set signet.database.existingSecret=external-db \
            --set signet.database.ownerExistingSecret=external-db-owner \
            --set signet.masterKey.existingSecret=external-key \
            --set signet.autoscaling.enabled=true > /dev/null

      # An external database with neither URL supplied is a deployment that
      # cannot enforce tenant isolation, so the chart refuses to render it. A
      # guard that stopped firing would be invisible without this.
      - name: Assert an external database without both identities is refused
        run: |
          if helm template signet deploy/helm/signet \
            --set signet.postgres.enabled=false > /dev/null 2>&1; then
            echo "The chart rendered without a database URL, which it must refuse"
            exit 1
          fi
          if helm template signet deploy/helm/signet \
            --set signet.postgres.enabled=false \
            --set signet.database.url=postgres://app:pw@db:5432/signet > /dev/null 2>&1; then
            echo "The chart rendered without an owner URL, which it must refuse"
            exit 1
          fi

      # Rendering proves the templates are valid; this proves they keep the two
      # database identities apart. A chart that leaks the owning identity into the
      # server's pod spec renders perfectly and lints clean.
      - name: Assert the owner credential reaches only the migration Job
        run: node scripts/checkChartCredentials.mjs

  e2e:
    name: End to end
    runs-on: ubuntu-latest
    # Twenty minutes: the stack builds Signet's image and waits for Pathling to
    # start a Spark session. A run that takes longer than this has hung rather
    # than been slow.
    timeout-minutes: 20
    # Non-default ports, deliberately. Moving the stack is a documented capability -
    # a developer whose 3000 is taken exports these three - and the only thing that
    # proves it is a run where every URL in the stack is derived rather than
    # hard-coded. A port left behind in compose, the seed or the suite fails here.
    #
    # A job-level `env` is the export route the documentation describes: every step
    # below runs with these in its environment, which is what `docker compose` and
    # Playwright need and what a `.env` file cannot give them.
    env:
      SIGNET_PORT: "3100"
      PATHLING_PORT: "8180"
      APP_PORT: "4100"
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - name: Install the browser
        run: bunx playwright install --with-deps chromium
        working-directory: e2e

      # Builds the production image and brings up Postgres, Signet, Pathling and
      # the stub SMART app. `--wait` blocks on the health checks, so a service
      # that never becomes healthy fails here with its own logs rather than as a
      # confusing test failure.
      - name: Bring up the stack
        run: bun run stack:up

      - name: Run the suite
        run: bun run test:e2e

      - name: Collect the stack's logs
        if: failure()
        run: docker compose -f deploy/compose/docker-compose.yml logs --no-color

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7

      - name: Tear down
        if: always()
        run: bun run stack:down
