# Keeps the Trivy vulnerability DB cache fresh on the default branch, so scans
# in pull requests can restore it instead of downloading it. GitHub restricts
# cache access to the current branch and the default branch, so a cache made on
# a feature branch is invisible to PR runs - it has to be made here.
#
# Copyright © 2026, Commonwealth Scientific and Industrial Research Organisation
# (CSIRO) ABN 41 687 119 230. Licensed under the Apache License, Version 2.0.
#
# Author: John Grimes

name: Update Trivy cache

on:
  schedule:
    - cron: "55 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update-trivy-db:
    runs-on: ubuntu-latest
    steps:
      - name: Setup oras
        uses: oras-project/setup-oras@v1

      - name: Get current date
        id: date
        run: echo "date=$(date +'%Y-%m-%d')" >> "$GITHUB_OUTPUT"

      # The path and key format match what trivy-action's built-in caching uses,
      # so a scan run with TRIVY_SKIP_DB_UPDATE=true restores this entry.
      - name: Download and extract the vulnerability DB
        run: |
          mkdir -p "$GITHUB_WORKSPACE/.cache/trivy/db"
          oras pull ghcr.io/aquasecurity/trivy-db:2
          tar -xzf db.tar.gz -C "$GITHUB_WORKSPACE/.cache/trivy/db"
          rm db.tar.gz

      - name: Cache DB
        uses: actions/cache/save@v4
        with:
          path: "${{ github.workspace }}/.cache/trivy"
          key: cache-trivy-${{ steps.date.outputs.date }}
