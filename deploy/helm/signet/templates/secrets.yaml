{{- /*
A connection URL secret is only needed when pointing at an external database
and no existing secret was supplied. With the bundled subchart enabled, the
password lives in the subchart's secret and is referenced directly - see
`signet.env` in _helpers.tpl.

Two URLs, because a deployment runs two database identities: the serving role the
server connects as, which owns nothing and is therefore bound by the tenant
isolation policies, and the owning identity, which applies migrations and is
exempt. They are separate secrets rather than two keys of one, so that the
Deployment can be given the first without the second being mounted alongside it.
*/ -}}
{{- if and (not .Values.postgresql.enabled) (not .Values.database.existingSecret) }}
{{- if not .Values.database.url }}
{{- fail "database.url or database.existingSecret must be set when postgresql.enabled is false" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "signet.fullname" . }}-db
  labels:
    {{- include "signet.labels" . | nindent 4 }}
type: Opaque
stringData:
  url: {{ .Values.database.url | quote }}
---
{{- end }}
{{- if and (not .Values.postgresql.enabled) (not .Values.database.ownerExistingSecret) }}
{{- if not .Values.database.ownerUrl }}
{{- fail "database.ownerUrl or database.ownerExistingSecret must be set when postgresql.enabled is false: migrations are DDL and must be applied by the identity that owns the schema, which the server must not connect as" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "signet.fullname" . }}-db-owner
  labels:
    {{- include "signet.labels" . | nindent 4 }}
type: Opaque
stringData:
  ownerUrl: {{ .Values.database.ownerUrl | quote }}
---
{{- end }}
{{- if not .Values.masterKey.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "signet.fullname" . }}-master-key
  labels:
    {{- include "signet.labels" . | nindent 4 }}
  annotations:
    # Generated once on install and preserved across upgrades. Losing this key
    # makes every stored endpoint signing key undecryptable.
    "helm.sh/resource-policy": keep
type: Opaque
stringData:
  masterKey: {{ .Values.masterKey.value | default (randAlphaNum 44) | quote }}
{{- end }}
