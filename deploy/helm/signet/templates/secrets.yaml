{{- /*
Secrets for the server and the migration Job. The bundled PostgreSQL keeps its
own credentials in postgres.yaml, beside the database they belong to.

The two connection URLs below are needed only when pointing at an external
database and no existing secret was supplied. They are separate secrets rather
than two keys of one, so that the Deployment can be given the serving role
without the owning identity being mounted alongside it.
*/ -}}
{{- if and (not .Values.signet.postgres.enabled) (not .Values.signet.database.existingSecret) }}
{{- if not .Values.signet.database.url }}
{{- fail "signet.database.url or signet.database.existingSecret must be set when signet.postgres.enabled is false" }}
{{- end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-db
  labels:
    {{- include "signet.labels" . | nindent 4 }}
type: Opaque
stringData:
  url: {{ .Values.signet.database.url | quote }}
{{- end }}
{{- if and (not .Values.signet.postgres.enabled) (not .Values.signet.database.ownerExistingSecret) }}
{{- if not .Values.signet.database.ownerUrl }}
{{- fail "signet.database.ownerUrl or signet.database.ownerExistingSecret must be set when signet.postgres.enabled is false: migrations are DDL and must be applied by the identity that owns the schema, which the server must not connect as" }}
{{- end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-db-owner
  labels:
    {{- include "signet.labels" . | nindent 4 }}
type: Opaque
stringData:
  ownerUrl: {{ .Values.signet.database.ownerUrl | quote }}
{{- end }}
{{- if not .Values.signet.masterKey.existingSecret }}
{{- /*
Read back from the cluster before generating, because a key generated afresh on
every upgrade would replace the one the stored signing keys were encrypted
under. `lookup` returns nothing during `helm template`, which is why rendering
the chart produces a different key each time and installing it does not.
*/ -}}
{{- $secretName := printf "%s-master-key" .Release.Name }}
{{- $existing := (lookup "v1" "Secret" .Release.Namespace $secretName) | default dict }}
{{- $existingData := (get $existing "data") | default dict }}
{{- $masterKey := .Values.signet.masterKey.value | default (get $existingData "masterKey" | b64dec) | default (randAlphaNum 44) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "signet.labels" . | nindent 4 }}
  annotations:
    # Generated once on install and preserved across upgrades. Losing this key
    # makes every stored endpoint signing key undecryptable.
    "helm.sh/resource-policy": keep
type: Opaque
stringData:
  masterKey: {{ $masterKey | quote }}
{{- end }}
{{- if gt (len .Values.signet.secretConfig) 0 }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-config
  labels:
    {{- include "signet.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $name, $value := .Values.signet.secretConfig }}
  {{ $name }}: {{ $value | quote }}
  {{- end }}
{{- end }}
