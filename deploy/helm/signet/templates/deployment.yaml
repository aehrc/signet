apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-deployment
  labels:
    {{- include "signet.labels" . | nindent 4 }}
spec:
  {{- if not .Values.signet.autoscaling.enabled }}
  replicas: {{ .Values.signet.replicas }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "signet.selectorLabels" . | nindent 6 }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        {{- include "signet.selectorLabels" . | nindent 8 }}
        {{- range $label, $value := .Values.signet.podLabels }}
        {{ $label }}: {{ $value | quote }}
        {{- end }}
      # The checksum rolls the pods when `secretConfig` changes. Without it the
      # Deployment is unchanged by an edit to the Secret it reads, and the
      # running pods keep the old values with nothing to show for it.
      annotations: {{ toJson (merge (dict "signet/secret-config-checksum" (toJson .Values.signet.secretConfig | sha256sum)) .Values.signet.podAnnotations) }}
    spec:
      # Signet never calls the Kubernetes API, so it is given no token to do it
      # with.
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: {{ .Values.signet.terminationGracePeriodSeconds }}
      imagePullSecrets: {{ toJson .Values.signet.imagePullSecrets }}
      securityContext: {{ toJson .Values.signet.podSecurityContext }}
      containers:
        - name: signet
          image: {{ .Values.signet.image | quote }}
          imagePullPolicy: {{ .Values.signet.imagePullPolicy | quote }}
          securityContext: {{ toJson .Values.signet.securityContext }}
          ports:
            - name: http
              containerPort: {{ .Values.signet.service.targetPort }}
              protocol: TCP
          env:
            {{- include "signet.env" . | nindent 12 }}
          {{- if gt (len .Values.signet.secretConfig) 0 }}
          # Before `env`, so a name set in both `config` and `secretConfig`
          # takes its value from `config`: Kubernetes lets `env` override
          # `envFrom`.
          envFrom:
            - secretRef:
                name: {{ printf "%s-config" .Release.Name | quote }}
          {{- end }}
          # `/healthz` answers from the process alone and `/readyz` consults the
          # database, so a pod that has lost its connection is taken out of the
          # load balancer rather than restarted.
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 2
            timeoutSeconds: 3
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources: {{ toJson .Values.signet.resources }}
          volumeMounts:
            # readOnlyRootFilesystem is on, so anything needing writes is
            # mounted.
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
      nodeSelector: {{ toJson .Values.signet.nodeSelector }}
      affinity: {{ toJson .Values.signet.affinity }}
      tolerations: {{ toJson .Values.signet.tolerations }}
      {{- with .Values.signet.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- range . }}
        - {{ toYaml . | nindent 10 | trim }}
          labelSelector:
            matchLabels:
              {{- include "signet.selectorLabels" $ | nindent 14 }}
        {{- end }}
      {{- end }}
