# Signet - multi-tenant SMART App Launch authorization server.
#
# See README.md in this directory for what every value below controls.

signet:
  image: "ghcr.io/csiro/signet:0.1.0"
  imagePullPolicy: "Always"
  imagePullSecrets: []
  replicas: 2

  # Non-sensitive environment for the server and the migration job. Any variable
  # Signet reads can go here; `.env.example` in the repository root lists them.
  #
  # The sweep CronJob reads neither this nor `secretConfig`: it takes the owning
  # identity and its own grace period and nothing else. So a database credential
  # put here rather than under `database` below would give a migration Job that
  # works and a sweep that fails nightly.
  #
  # SIGNET_PUBLIC_URL is the public origin Signet is reached on, and endpoint
  # issuers are derived from it (`{origin}/t/{tenant}/e/{endpoint}`) - so
  # changing it invalidates every issuer already published to FHIR servers and
  # registered clients.
  config:
    SIGNET_PUBLIC_URL: "https://signet.example.org"
    SIGNET_LOG_LEVEL: "info"

  # Sensitive environment, written to a Secret and mounted by reference. Same
  # shape as `config`, which takes precedence for a name set in both: Kubernetes
  # lets a container's `env` override its `envFrom`.
  secretConfig: {}

  # Envelope key protecting endpoint signing keys at rest. Leave both unset and
  # the chart generates one on install and keeps it across upgrades; a real
  # deployment should manage it outside the chart and set `existingSecret`.
  masterKey:
    existingSecret: ~
    existingSecretKey: "masterKey"
    value: ~

  # A deployment runs two database identities, and keeping them apart is what
  # makes the tenant isolation policies bind Signet at all. The serving role
  # owns none of Signet's tables, because Postgres exempts a table's owner from
  # that table's row-level security policies. The owning identity applies
  # migrations and reaches only the migration job.
  #
  # Ignored when `postgres.enabled` is true, which creates both.
  database:
    existingSecret: ~
    existingSecretKey: "url"
    url: ~
    ownerExistingSecret: ~
    ownerExistingSecretKey: "ownerUrl"
    ownerUrl: ~

  # Applies migrations and grants the serving role, as a Helm hook that runs
  # before new pods roll out.
  migrations:
    enabled: true
    backoffLimit: 3
    activeDeadlineSeconds: 600

  # Deletes expired runtime rows across every tenant, nightly.
  #
  # On by default, because the growth it removes happens in ordinary use rather
  # than only when something goes wrong: a passkey ceremony writes a challenge row
  # that is deleted only when the ceremony completes, so every browser prompt
  # somebody dismisses leaves one behind. Nothing depends on the job running -
  # every row it removes is already expired and unusable - so turning it off costs
  # disk and nothing else.
  #
  # This is the second pod spec carrying the owning identity, and the only other
  # one: the sweep acts across tenants, which the serving role cannot do.
  sweep:
    enabled: true
    # Off the hour, and out of the busy part of the day for most deployments.
    schedule: "17 3 * * *"
    # How far the access token sweep's cut-off lags the present. Those records are
    # a revocation list rather than runtime state, so one deleted the moment it
    # expires turns a slightly late introspection - a resource server whose clock
    # is behind Signet's - into an unknown token rather than an inactive one.
    # A whole number followed by s, m, h or d.
    accessTokenGrace: "24h"
    backoffLimit: 3
    activeDeadlineSeconds: 900
    startingDeadlineSeconds: 300
    successfulJobsHistoryLimit: 3
    failedJobsHistoryLimit: 3

  service:
    type: "ClusterIP"
    port: 80
    targetPort: 3000
    annotations: {}

  resources: {}
    # requests:
    #   cpu: "100m"
    #   memory: "256Mi"
    # limits:
    #   cpu: "1"
    #   memory: "512Mi"

  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70

  podDisruptionBudget:
    enabled: true
    minAvailable: 1

  podAnnotations: {}
  podLabels: {}

  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
    seccompProfile:
      type: "RuntimeDefault"

  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop:
        - "ALL"

  terminationGracePeriodSeconds: 30

  nodeSelector: {}
  tolerations: []
  affinity: {}

  # Spread replicas across nodes so a single node loss cannot take the
  # authorization server offline.
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: "kubernetes.io/hostname"
      whenUnsatisfiable: "ScheduleAnyway"

  # A bundled PostgreSQL, for evaluation and connectathons. It is a single
  # replica with no backups; a production deployment should turn this off and
  # point `database` at a managed instance.
  #
  # Both identities are created here: `owner` owns the schema the migrations
  # create, and `servingRole` - created on first initialisation and owning
  # nothing - is what the server connects as. Leave the passwords unset and the
  # chart generates them on install and reuses them on upgrade.
  postgres:
    enabled: true
    image: "postgres:18-alpine"
    imagePullPolicy: "Always"
    database: "signet"
    owner: "signet"
    ownerPassword: ~
    servingRole: "signet_app"
    servingPassword: ~
    resources: {}
      # requests:
      #   cpu: "250m"
      #   memory: "512Mi"
      # limits:
      #   cpu: "2"
      #   memory: "2Gi"
    persistence:
      enabled: true
      size: "8Gi"
      storageClassName: ~
    podSecurityContext:
      runAsNonRoot: true
      runAsUser: 70
      runAsGroup: 70
      fsGroup: 70
      seccompProfile:
        type: "RuntimeDefault"
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - "ALL"
    nodeSelector: {}
    tolerations: []
    affinity: {}
