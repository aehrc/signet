replicaCount: 2

image:
  repository: ghcr.io/csiro/signet
  tag: "" # defaults to .Chart.AppVersion
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

# The public origin Signet is reached on. Endpoint issuers are derived from it
# (`{publicUrl}/t/{tenant}/e/{endpoint}`), so changing it invalidates every
# issuer value already published to FHIR servers and registered clients.
publicUrl: https://signet.example.org

logLevel: info

# A deployment runs two database identities, and keeping them apart is what makes
# the tenant isolation policies bind Signet at all.
#
#   - The serving role is what the server connects as. It must own none of
#     Signet's tables: Postgres exempts a table's owner from that table's
#     row-level security policies, so a server connecting as the owner would be
#     unconstrained by them. The server verifies this at startup and refuses to
#     serve if the role it is given is exempt.
#   - The owning identity applies migrations and issues the grants that follow
#     them. It reaches only the migration Job, never the server's pods.
#
# With the bundled subchart, both already exist and nothing has to be created:
# `postgresql.auth.username` below is the serving role, and the subchart's
# `postgres` superuser is the owning identity. Pointing at an external database
# means creating the serving role yourself and supplying both URLs here; see the
# tenant isolation section of docs/operations.md for the statements.
database:
  # Ignored when postgresql.enabled is true.
  existingSecret: ""
  existingSecretKey: url
  # The serving role's connection URL.
  url: ""
  # The owning identity, read only by the migration Job. Required when
  # postgresql.enabled is false, and it must name a different role from the one
  # above - `migrate` refuses two URLs naming the same role, because that
  # deployment could not enforce isolation.
  ownerExistingSecret: ""
  ownerExistingSecretKey: ownerUrl
  ownerUrl: ""

# Envelope key protecting endpoint signing keys at rest. Never set this in
# values for a real deployment - supply it through existingSecret.
masterKey:
  existingSecret: ""
  existingSecretKey: masterKey
  value: ""

migrations:
  # Runs as a pre-install/pre-upgrade hook Job before new pods roll out.
  enabled: true
  backoffLimit: 3
  activeDeadlineSeconds: 600

service:
  type: ClusterIP
  port: 80
  targetPort: 3000
  annotations: {}

ingress:
  enabled: false
  className: nginx
  annotations: {}
  hosts:
    - host: signet.example.org
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: "1"
    memory: 512Mi

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70

podDisruptionBudget:
  enabled: true
  minAvailable: 1

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

nodeSelector: {}
tolerations: []
affinity: {}

# Spread replicas across nodes so a single node loss cannot take the
# authorization server offline.
topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: kubernetes.io/hostname
    whenUnsatisfiable: ScheduleAnyway

extraEnv: []

postgresql:
  enabled: true
  auth:
    # The serving role. A custom user in this subchart owns the database but none
    # of the tables in it, because the migrations are applied by the superuser
    # below - which is what leaves the policies applying to this role.
    username: signet
    database: signet
    # Leave unset to have the subchart generate a password.
    password: ""
    # The owning identity, used by the migration Job alone. Leave unset to have
    # the subchart generate one. A password supplied here reaches the Job as part
    # of a connection URL, so it must be URL-safe; pass a complete URL through
    # `database.ownerExistingSecret` if it is not.
    postgresPassword: ""
  primary:
    persistence:
      enabled: true
      size: 8Gi
