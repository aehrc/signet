# The regular app behind oauth2-proxy. Static files, with server side includes
# turned on so the page and the API response can show the identity headers
# oauth2-proxy passed upstream.

server {
  listen 80;
  root /usr/share/nginx/html;

  ssi on;
  ssi_types application/json;

  location / {
    index index.html;
  }
}
